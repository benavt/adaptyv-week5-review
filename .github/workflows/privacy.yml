name: Privacy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Scan tracked files
        run: python3 scripts/check_privacy.py
      - name: Checker unit tests
        if: always()
        run: python3 -m unittest -v tests.test_check_privacy
