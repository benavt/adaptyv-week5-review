name: Publish approved Week 5 review
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publication controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download the approved release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          c=json.loads(Path('publication.json').read_text())
          assert re.fullmatch(r'[0-9A-Za-z_-]+',c['release_tag'])
          assert c['asset_name']=='week5-review-site.tar.gz'
          subprocess.run(['gh','release','download',c['release_tag'],'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',c['asset_name'],'--dir','package'],check=True)
          PY
      - name: Verify exact approved files and model hashes
        run: python3 verify_public_review_bundle.py --archive package/week5-review-site.tar.gz --config publication.json --output published-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: published-site
      - name: Publish review
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
